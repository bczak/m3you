name: Docs

# Pull-request check only. Pushes to development are covered by release.yml,
# which runs the same verification before deploying — running both would just
# duplicate the work.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate prop tables
        run: bun run --cwd docs docgen

      - name: Check documentation coverage
        run: bun run --cwd docs test

      - name: Type-check
        run: bun run --cwd docs types:check

      - name: Build site
        run: bun run --cwd docs build
