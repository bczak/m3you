name: Release

# On every push to development: verify, then publish the documentation site and
# Storybook to Cloudflare Pages, and publish the library to npm if — and only
# if — package.json carries a version that is not on the registry yet.
#
# That last condition is what makes this safe to run on every push. Bumping the
# version in package.json is the release trigger; pushes that do not touch it
# redeploy the sites and skip npm.
#
# Repository secrets required (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — right-hand sidebar of any domain overview
#
# npm needs no secret: publishing uses Trusted Publishing, where npm verifies a
# short-lived GitHub OIDC token instead of a stored credential. Configure it at
# npmjs.com → m3you → Settings → Trusted Publisher, pointing at this repository
# and the workflow file `release.yml`. Provenance attestations are generated
# automatically as a result.

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

# Never let two releases overlap. Not cancel-in-progress: a half-finished npm
# publish is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-publish: ${{ steps.version.outputs.should-publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5

      - run: bun install --frozen-lockfile

      # The `storybook` vitest project runs stories in a real browser to check
      # accessibility, so the suite needs a Chromium binary. Without this the
      # run reports "42 passed (83)" — the browser project silently never runs.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Library tests
        run: bun run test

      # docgen.json is generated and git-ignored. `docs build` regenerates it via
      # its prebuild hook, but the tests run without building, so it has to be
      # produced explicitly here.
      - name: Generate prop tables
        run: bun run --cwd docs docgen

      - name: Documentation coverage
        run: bun run --cwd docs test

      - name: Type-check docs
        run: bun run --cwd docs types:check

      - name: Is this version already on npm?
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Distinguish "this version does not exist" from "the registry did not
          # answer". Treating a network blip as "not published" would send the
          # job on to publish; better to fail loudly here.
          if OUTPUT="$(npm view "m3you@$VERSION" version 2>&1)"; then
            echo "m3you@$VERSION is already published ($OUTPUT) — npm publish will be skipped."
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$OUTPUT" | grep -qE 'E404|404 '; then
            echo "m3you@$VERSION is not on the registry — it will be published."
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Could not reach the npm registry:"
            printf '%s\n' "$OUTPUT"
            exit 1
          fi

  docs:
    name: Documentation site
    needs: verify
    runs-on: ubuntu-latest
    # The Cloudflare credentials live in this environment's secrets, so the job
    # has to declare it — environment-scoped secrets are invisible to jobs that
    # do not.
    environment:
      name: development
      url: https://material.you
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run docs:build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Through the environment, never interpolated into the shell: a branch
          # name is attacker-influenceable on workflow_dispatch.
          BRANCH: ${{ github.ref_name }}
        run: >-
          bunx wrangler pages deploy docs/.output/public
          --project-name m3you-docs
          --branch "$BRANCH"

  storybook:
    name: Storybook
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://storybook.material.you
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build-storybook

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: >-
          bunx wrangler pages deploy storybook-static
          --project-name m3you-storybook
          --branch "$BRANCH"

  npm:
    name: Publish to npm
    needs: verify
    if: needs.verify.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC token npm exchanges for publish rights.
      # Without it, Trusted Publishing fails with a missing-token error.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing landed in npm 11.5.1; the npm bundled with Node is
      # older than that, so upgrade the CLI rather than relying on the runtime.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: bun install --frozen-lockfile

      - name: Publish
        # No token: npm verifies the OIDC token from this workflow. That is also
        # what lets it attach a provenance attestation automatically.
        #
        # `prepublishOnly` rebuilds the library, so the tarball always matches
        # the committed source rather than whatever happens to be in dist/.
        run: npm publish --access public

      - name: Summary
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: echo "Published m3you@$VERSION" >> "$GITHUB_STEP_SUMMARY"
