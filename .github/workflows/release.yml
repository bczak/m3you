name: Release

# Runs on both release branches:
#
#   development → prerelease on the `dev` dist-tag (0.2.1-dev.1, -dev.2, …)
#   master      → stable release on `latest` (0.2.1, 0.3.0, …)
#
# semantic-release decides whether there is anything to release and what the
# version is, from the commit messages since the last tag. A push containing
# only `docs:` or `chore:` commits publishes nothing and simply redeploys the
# sites.
#
# npm needs no secret: @semantic-release/npm exchanges the GitHub OIDC token for
# a short-lived publish token (Trusted Publishing), configured at
# npmjs.com → m3you → Settings → Trusted Publisher against this workflow file.
# If the exchange fails it falls back to NPM_TOKEN, which is why that secret is
# still passed through.
#
# Cloudflare credentials live in the `development` environment's secrets.

on:
  push:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
      - run: bun install --frozen-lockfile

      # The `storybook` vitest project renders stories in a real browser, so the
      # suite needs a Chromium binary. Without it half the test files silently
      # never run.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Library tests
        run: bun run test

      # docgen.json is generated and git-ignored; the docs build regenerates it
      # via a prebuild hook, but the tests run without building.
      - name: Generate prop tables
        run: bun run --cwd docs docgen

      - name: Documentation coverage
        run: bun run --cwd docs test

      - name: Type-check docs
        run: bun run --cwd docs types:check

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags and GitHub Releases
      issues: write
      pull-requests: write
      id-token: write # mint the OIDC token npm exchanges for publish rights
    steps:
      - uses: actions/checkout@v5
        with:
          # semantic-release reads the full history to find the last release and
          # everything committed since it.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Trusted Publishing requires npm 11.5.1 or newer; the npm bundled with
      # Node is older.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: bun install --frozen-lockfile

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only used if the OIDC exchange fails.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bunx semantic-release

  docs:
    name: Documentation site
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://material.you
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run docs:build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Through the environment, never interpolated into the shell.
          BRANCH: ${{ github.ref_name }}
        run: |
          bunx wrangler pages project create m3you-docs \
            --production-branch master 2>/dev/null || true

          bunx wrangler pages deploy docs/.output/public \
            --project-name m3you-docs \
            --branch "$BRANCH"

  storybook:
    name: Storybook
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://storybook.material.you
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build-storybook

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          bunx wrangler pages project create m3you-storybook \
            --production-branch master 2>/dev/null || true

          bunx wrangler pages deploy storybook-static \
            --project-name m3you-storybook \
            --branch "$BRANCH"
