name: React Doctor

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run React Doctor
        id: doctor
        shell: bash
        run: |
          set +e
          bunx react-doctor@latest . --yes --annotations --fail-on warning 2>&1 | tee react-doctor-output.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fail if React Doctor found issues
        if: steps.doctor.outputs.status != '0'
        run: exit 1
