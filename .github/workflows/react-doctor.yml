name: React Doctor

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run React Doctor
        id: doctor
        shell: bash
        run: |
          bun run react-doctor 2>&1 | tee react-doctor-output.txt

      - name: Update React Doctor PR status comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- react-doctor-status-comment -->';
            const passed = '${{ steps.doctor.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'passed' : 'failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const outputPath = 'react-doctor-output.txt';
            const rawOutput = fs.existsSync(outputPath) ? fs.readFileSync(outputPath, 'utf8').trim() : '';
            const summary = rawOutput.length > 3500 ? rawOutput.slice(rawOutput.length - 3500) : rawOutput;

            const body = `${marker}
            ## ${icon} React Doctor ${status}

            **Commit:** \`${context.payload.pull_request.head.sha.slice(0, 7)}\`
            **Workflow run:** [#${context.runNumber}](${runUrl})

            <details>
            <summary>React Doctor output</summary>

            \`\`\`text
            ${summary || 'No output captured.'}
            \`\`\`
            </details>`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
