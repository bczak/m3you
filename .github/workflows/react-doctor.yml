name: React Doctor

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run React Doctor
        id: doctor
        shell: bash
        run: |
          set +e
          bunx react-doctor@latest . --yes --annotations --fail-on warning 2>&1 | tee react-doctor-output.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare React Doctor PR status comment
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ steps.doctor.outputs.status }}" = "0" ]; then
            icon="✅"
            status="passed"
          else
            icon="❌"
            status="failed"
          fi

          cat > react-doctor-comment.md <<EOF
          ## ${icon} React Doctor ${status}

          **Commit:** \`${{ github.event.pull_request.head.sha }}\`
          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          <details>
          <summary>React Doctor output</summary>

          \`\`\`text
          EOF
          tail -n 120 react-doctor-output.txt >> react-doctor-comment.md
          cat >> react-doctor-comment.md <<EOF
          \`\`\`
          </details>
          EOF

      - name: Update React Doctor PR status comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: react-doctor-status
          recreate: true
          path: react-doctor-comment.md

      - name: Fail if React Doctor found issues
        if: steps.doctor.outputs.status != '0'
        run: exit 1
